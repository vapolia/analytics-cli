name: release

# A published GitHub release tagged vX.Y.Z gets one native vana binary per platform. Any other tag fails the run.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  cli:
    strategy:
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, file: vana.exe }
          - { os: macos-latest, rid: osx-arm64, file: vana }
          - { os: ubuntu-latest, rid: linux-x64, file: vana }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag '$TAG' is not vX.Y.Z"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish src/Vana.Cli -c Release -r ${{ matrix.rid }} -p:Version=${{ env.VERSION }} -o out
      - shell: bash
        run: |
          name=vana-${{ matrix.rid }}${{ matrix.rid == 'win-x64' && '.exe' || '' }}
          mv out/${{ matrix.file }} "$name"
          gh release upload "$TAG" "$name" --clobber
